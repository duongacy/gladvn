<!DOCTYPE html>
<html>
<head>
<style>
  .span { display: inline-block; padding: 20px; background: lightgray; cursor: not-allowed; }
  .btn { padding: 10px; background: white; pointer-events: none; }
  .btn:hover { background: red; }
</style>
</head>
<body>
  <span class="span">
    <button class="btn">Hover me</button>
  </span>
</body>
</html>
